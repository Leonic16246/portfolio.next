services:
  nextjs-prod-standalone:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    image: portfolio-next:prod
    container_name: portfolio-next-prod
    ports:
      - "3001:3001"
    env_file:
      - path: .env.local
        required: false

  nextjs-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: portfolio-next:dev
    container_name: portfolio-next-dev
    ports:
      - "3001:3001"
    env_file:
      - path: .env.local
        required: false
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json

  nextjs-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: portfolio-next:dev
    container_name: portfolio-next-test
    env_file:
      - path: .env.local
        required: false
    command: ["npm", "run", "test:run"]
    profiles:
      - tools